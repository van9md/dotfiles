set -s escape-time 0
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -g allow-passthrough on
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
set -g renumber-windows on
set-window-option -g mode-keys vi

# prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

unbind r
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# popups
bind-key s display-popup -E "~/.config/scripts/tmux-sessionizer"
bind-key r display-popup -E "~/.config/scripts/fzf-ssh"
bind-key n display-popup -w 90% -h 85% -E "~/.config/scripts/fzf-notes"

bind-key b set-option status

# Copy to clipboard (Wayland)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi м send-keys -X begin-selection
bind -T copy-mode-vi н send-keys -X copy-pipe-and-cancel 'wl-copy'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# style
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'fg=color7 bg=default'
set -g status-left ''
set -g status-left-length 100
set -g status-right "#[fg=red]#(cat /sys/class/power_supply/BAT0/capacity)% #[fg=yellow]%H:%M"
setw -g window-status-current-style 'fg=colour1 bg=default bold'
setw -g window-status-current-format '#I:#W '
setw -g window-status-style 'fg=color8'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Дубли всех однобуквенных биндингов на русскую раскладку (после tpm, чтобы
# подхватились и его клавиши). prefix + c и prefix + с делают одно и то же.
run-shell '~/.config/scripts/tmux-ru-keys'
